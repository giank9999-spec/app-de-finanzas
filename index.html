<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<meta name="mobile-web-app-capable" content="yes">

<title>Mis Gastos</title>
<style>
:root{
  --bg:#f3f5f4; --card:#ffffff; --text:#14201c; --muted:#6b7a74; --border:#e3e8e6;
  --accent:#0f766e; --accent-soft:#d9f0ec; --danger:#dc2626; --danger-soft:#fde2e2;
  --warn:#d97706; --warn-soft:#fdf0d9; --ok:#16a34a; --ok-soft:#dcf5e3; --chip:#eef2f1; --on-accent:#ffffff;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0c1210; --card:#16201d; --text:#e8efec; --muted:#93a39d; --border:#25322e;
    --accent:#2dd4bf; --accent-soft:#123a35; --danger:#f87171; --danger-soft:#3b1717;
    --warn:#fbbf24; --warn-soft:#3a2c0e; --ok:#4ade80; --ok-soft:#12321d; --chip:#1e2a27; --on-accent:#04201c;
    --shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.35}
body{padding-top:env(safe-area-inset-top);padding-bottom:calc(76px + env(safe-area-inset-bottom));min-height:100vh;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
main{max-width:640px;margin:0 auto;padding:12px 16px 24px}
h1{font-size:28px;margin:8px 0 12px;letter-spacing:-.02em}
h2{font-size:17px;margin:0 0 10px}
h3{font-size:15px;margin:0}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow);border:1px solid var(--border)}
.row{display:flex;align-items:center;gap:10px} .between{justify-content:space-between} .wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.big{font-size:30px;font-weight:700;letter-spacing:-.02em}
.mid{font-size:20px;font-weight:650}
.right{text-align:right}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{border:0;background:var(--accent);color:#fff;border-radius:12px;padding:12px 16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
@media (prefers-color-scheme: dark){.btn{color:#04201c}}
.btn.block{width:100%} .btn.big-btn{padding:16px;font-size:18px;border-radius:14px}
.btn.ghost{background:var(--chip);color:var(--text)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:10px}
.iconbtn{border:0;background:var(--chip);width:38px;height:38px;border-radius:12px;font-size:18px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:9px;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
label.f{display:block;margin:12px 0 6px;font-size:13px;font-weight:600;color:var(--muted)}
input.in,select.in,textarea.in{width:100%;border:1px solid var(--border);background:var(--card);border-radius:12px;padding:12px;font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
input.in:focus,select.in:focus{border-color:var(--accent)}
.amount-in{font-size:40px;font-weight:700;text-align:center;border:0;background:transparent;width:100%;outline:none;padding:6px 0}
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cat-btn{border:2px solid transparent;background:var(--chip);border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;cursor:pointer;min-height:68px}
.cat-btn .e{font-size:24px}
.cat-btn.on{border-color:var(--accent);background:var(--accent-soft)}
.bar{height:8px;background:var(--chip);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.bar.ok>i{background:var(--ok)} .bar.warn>i{background:var(--warn)} .bar.over>i{background:var(--danger)}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;background:var(--chip);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.over{background:var(--danger-soft);color:var(--danger)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.list>.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);cursor:pointer}
.list>.item:last-child{border-bottom:0}
.emo{width:40px;height:40px;border-radius:12px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.day-h{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--muted);margin:14px 4px 4px}
.monthnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.monthnav b{font-size:17px;text-transform:capitalize}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:0;background:var(--chip);border-radius:99px;padding:7px 12px;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--accent);color:#fff}
@media (prefers-color-scheme: dark){.chip.on{color:#04201c}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat .lbl{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.stat .val{font-size:20px;font-weight:700;margin-top:2px}
.donut-wrap{display:flex;flex-direction:column;gap:12px;align-items:center}
.donut-wrap .legend{width:100%}
.legend{flex:1;min-width:0}
.legend .lg{display:flex;align-items:center;gap:8px;font-size:13px;padding:3px 0}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.vbars{display:flex;align-items:flex-end;gap:3px;height:120px;padding-top:6px}
.vbars .vb{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.vbars .vb i{display:block;width:100%;background:var(--accent);border-radius:4px 4px 2px 2px;min-height:2px}
.vbars .vb.cur i{background:var(--warn)}
.vbars .vb span{font-size:10px;color:var(--muted)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--border);display:flex;justify-content:space-around;align-items:flex-start;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:20}
nav.tabs a{flex:1;text-decoration:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:600;gap:2px;padding:4px 0}
nav.tabs a .ic{font-size:21px;line-height:1}
nav.tabs a.on{color:var(--accent)} nav.tabs a.on .ic{filter:none;opacity:1}
nav.tabs a.plus .ic{background:var(--accent);width:52px;height:52px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:30px;margin-top:-22px;filter:none;opacity:1;box-shadow:0 6px 16px rgba(15,118,110,.35)}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-150%);background:var(--text);color:var(--bg);padding:12px 16px;border-radius:14px;font-size:14px;font-weight:600;z-index:100;max-width:92vw;transition:transform .25s;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.warn{background:var(--warn);color:#1b1300} .toast.over{background:var(--danger);color:#fff}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet .grab{width:40px;height:5px;background:var(--border);border-radius:9px;margin:0 auto 10px}
.backrow{display:flex;align-items:center;gap:8px;margin:4px 0 4px}
.backrow a{color:var(--accent);text-decoration:none;font-weight:600}
.menu a{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--border);text-decoration:none;color:var(--text)}
.menu a:last-child{border-bottom:0}
.menu a::after{content:"›";margin-left:auto;color:var(--muted);font-size:22px}
.empty{text-align:center;color:var(--muted);padding:24px 8px}
.switch{position:relative;width:50px;height:30px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:var(--border);border-radius:99px;transition:.2s}
.switch span::before{content:"";position:absolute;width:26px;height:26px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch input:checked+span{background:var(--ok)}
.switch input:checked+span::before{transform:translateX(20px)}
.lim-in{width:110px;text-align:right;padding:8px 10px}
.note{font-size:13px;color:var(--muted);background:var(--chip);border-radius:12px;padding:10px 12px;margin:8px 0}
/* Íconos de línea (un solo color: toman el color del texto que los rodea) */
.ico{width:20px;height:20px;flex:none;display:block}
.ico.sm{width:16px;height:16px;display:inline-block;vertical-align:-3px}
.ico.in{width:16px;height:16px;display:inline-block;vertical-align:-3px;margin-right:6px}
.emo{color:var(--text)} .emo .ico{width:22px;height:22px}
.cat-btn{color:var(--text)} .cat-btn .e{display:flex} .cat-btn .e .ico{width:26px;height:26px} .cat-btn.on .e{color:var(--accent)}
.ico-pick{grid-template-columns:repeat(5,1fr)} .ico-pick .cat-btn{min-height:52px;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:6px} .chip .ico{width:16px;height:16px}
.seg button{display:inline-flex;align-items:center;justify-content:center;gap:6px} .seg button .ico{width:18px;height:18px} .seg button.on .ico{color:var(--accent)}
.btn .ico{width:18px;height:18px}
.lg .ico{width:16px;height:16px}
.toast{display:flex;align-items:center;gap:8px} .toast .ico{width:18px;height:18px}
nav.tabs a .ic{filter:none;opacity:1;color:inherit} nav.tabs a .ic .ico{width:24px;height:24px}
nav.tabs a.plus .ic{color:var(--on-accent)} nav.tabs a.plus .ic .ico{width:28px;height:28px}
</style>
</head>
<body>
<main id="app"></main>
<nav class="tabs" id="tabs">
  <a href="#inicio" data-tab="inicio"><span class="ic" data-ic="inicio"></span>Inicio</a>
  <a href="#gastos" data-tab="gastos"><span class="ic" data-ic="gastos"></span>Gastos</a>
  <a href="#nuevo" data-tab="nuevo" class="plus" aria-label="Nuevo gasto"><span class="ic" data-ic="nuevo"></span></a>
  <a href="#presupuesto" data-tab="presupuesto"><span class="ic" data-ic="presupuesto"></span>Presupuesto</a>
  <a href="#mas" data-tab="mas"><span class="ic" data-ic="mas"></span>Más</a>
</nav>
<div class="toast" id="toast"></div>
<script>
'use strict';
/* ============ Datos ============ */
const KEY = 'misgastos_v1';
const ICONS = {"comida": "<path d=\"M5 3v4a2 2 0 0 0 4 0V3M7 3v18\"/><path d=\"M17 21V3c-2 1-3 4-3 8h3\"/>", "transporte": "<rect x=\"5\" y=\"3\" width=\"14\" height=\"15\" rx=\"3\"/><path d=\"M5 11h14M9 6.5h6M8 18v2.5M16 18v2.5M8.5 14.5h.01M15.5 14.5h.01\"/>", "varios": "<path d=\"M5 8h14l-1 12a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1z\"/><path d=\"M9 8V6.5a3 3 0 0 1 6 0V8\"/>", "salud": "<g transform=\"rotate(-45 12 12)\"><rect x=\"3\" y=\"8.5\" width=\"18\" height=\"7\" rx=\"3.5\"/><path d=\"M12 8.5v7\"/></g>", "entretenimiento": "<path d=\"M3 7h18v3a2 2 0 0 0 0 4v3H3v-3a2 2 0 0 0 0-4z\"/><path d=\"M14.5 7.5v1.5M14.5 11.25v1.5M14.5 15v1.5\"/>", "pagos": "<path d=\"M6 3h12v18l-2-1.5-2 1.5-2-1.5-2 1.5-2-1.5-2 1.5z\"/><path d=\"M9 8h6M9 12h6M9 16h3\"/>", "novia": "<path d=\"M12 20s-7.5-4.5-7.5-10.2A4.3 4.3 0 0 1 12 7.2a4.3 4.3 0 0 1 7.5 2.6C19.5 15.5 12 20 12 20z\"/>", "otros": "<path d=\"M4 7.5 12 3.5l8 4v9l-8 4-8-4z\"/><path d=\"M4 7.5l8 4 8-4M12 11.5v9\"/>", "sin-categoria": "<circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.4M12 16.8h.01\"/>", "etiqueta": "<path d=\"M3.5 12.2V4.5a1 1 0 0 1 1-1h7.7l8.3 8.3-8.7 8.7z\"/><path d=\"M8 8h.01\"/>", "credito": "<rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2.5\"/><path d=\"M3 10h18M7 15h3\"/>", "debito": "<path d=\"M3.5 9 12 4.5 20.5 9M4.5 9h15M6.5 12v5M10 12v5M14 12v5M17.5 12v5M3.5 20h17\"/>", "efectivo": "<rect x=\"2.5\" y=\"6\" width=\"19\" height=\"12\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"2.5\"/><path d=\"M6 12h.01M18 12h.01\"/>", "inicio": "<path d=\"M4 20h16M7 16v-5M12 16V6M17 16V9\"/>", "gastos": "<path d=\"M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01\"/>", "presupuesto": "<circle cx=\"12\" cy=\"12\" r=\"9\"/><circle cx=\"12\" cy=\"12\" r=\"5\"/><path d=\"M12 12h.01\"/>", "mas": "<path d=\"M4 7h16M4 12h16M4 17h16\"/>", "nuevo": "<path d=\"M12 5v14M5 12h14\"/>", "cuotas": "<rect x=\"3.5\" y=\"5\" width=\"17\" height=\"15\" rx=\"2.5\"/><path d=\"M3.5 10h17M8 3v4M16 3v4\"/>", "metas": "<path d=\"M8 4h8v5a4 4 0 0 1-8 0z\"/><path d=\"M8 6H5.5a2.5 2.5 0 0 0 2.6 3.5M16 6h2.5a2.5 2.5 0 0 1-2.6 3.5M12 13v7M9 20h6\"/>", "ajustes": "<path d=\"M4 7h10M18 7h2M4 17h4M12 17h8\"/><circle cx=\"16\" cy=\"7\" r=\"2\"/><circle cx=\"10\" cy=\"17\" r=\"2\"/>", "aviso": "<path d=\"M12 4 21 20H3z\"/><path d=\"M12 10v4M12 17h.01\"/>", "check": "<path d=\"M5 12.5 9.5 17 19 7\"/>"};
const ico = (n, cls='') => `<svg class="ico ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]||ICONS.etiqueta}</svg>`;
const EMOJI_ICON = {'🍽️':'comida','🍽':'comida','🚌':'transporte','🛍️':'varios','🛍':'varios','💊':'salud','🎬':'entretenimiento','🧾':'pagos','❤️':'novia','❤':'novia','📦':'otros','❔':'sin-categoria','🏷️':'etiqueta','🏷':'etiqueta','🎯':'presupuesto','🏆':'metas','💳':'credito','🏦':'debito','💵':'efectivo','🗓️':'cuotas','🗓':'cuotas'};
const CAT_ICONS = ['comida','transporte','varios','salud','entretenimiento','pagos','novia','otros','etiqueta','credito','debito','efectivo','cuotas','metas','presupuesto'];
const GOAL_ICONS = ['presupuesto','metas','efectivo','debito','transporte','varios','salud','novia','otros','etiqueta'];
function migrateIcons(st){
  const def = Object.fromEntries(DEFAULT_CATS.map(([id,,icon])=>[id,icon]));
  (st.cats||[]).forEach(c=>{ if(!c.icon || !ICONS[c.icon]) c.icon = EMOJI_ICON[c.emoji] || def[c.id] || 'etiqueta'; });
  (st.goals||[]).forEach(g=>{ if(!g.icon || !ICONS[g.icon]) g.icon = EMOJI_ICON[g.emoji] || 'presupuesto'; });
  return st;
}
const COLORS = ['#0f766e','#f59e0b','#6366f1','#ef4444','#ec4899','#0ea5e9','#e11d48','#84cc16','#a855f7','#14b8a6','#f97316','#64748b'];
const DEFAULT_CATS = [
  ['comida','Comida','comida'],['transporte','Transporte','transporte'],['varios','Varios','varios'],['salud','Salud','salud'],
  ['entretenimiento','Entretenimiento','entretenimiento'],['pagos','Pagos','pagos'],['novia','Mi novia','novia'],['otros','Otros','otros']
];
const METHODS = {credito:{n:'Tarjeta de crédito',s:'Crédito',i:'credito'}, debito:{n:'Débito',s:'Débito',i:'debito'}, efectivo:{n:'Efectivo',s:'Efectivo',i:'efectivo'}};
const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MSHORT = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

function freshState(){
  return {
    v:1,
    settings:{currency:'S/', quickAdd:true, lastMethod:'debito', lastCard:null, lastAccount:null},
    cats: DEFAULT_CATS.map(([id,name,icon],i)=>({id,name,icon,limit:0,color:COLORS[i]})),
    cards:[], accounts:[], moves:[], expenses:[], cardPayments:[], plans:[], goals:[], alerts:{}
  };
}
function load(){
  try{ const raw = localStorage.getItem(KEY); if(raw){ const s = JSON.parse(raw); return migrateIcons(Object.assign(freshState(), s, {settings:Object.assign(freshState().settings, s.settings||{})})); } }catch(e){}
  return freshState();
}
let S = load();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast('No se pudo guardar: '+e.message,'over'); } }
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ============ Utilidades ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : 0; };
const r2 = n => Math.round(n*100)/100;
function fmt(n, dec=2){ return S.settings.currency+' '+(n||0).toLocaleString('es-PE',{minimumFractionDigits:dec,maximumFractionDigits:dec}); }
function fmt0(n){ return fmt(n, Math.abs(n)>=1000?0:2); }
const pad = n => String(n).padStart(2,'0');
function nowLocal(){ const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; }
const curMonth = () => nowLocal().slice(0,7);
function monthLabel(m){ const [y,mo]=m.split('-').map(Number); return MONTHS[mo-1]+' '+y; }
function shiftMonth(m, d){ let [y,mo]=m.split('-').map(Number); mo+=d; while(mo<1){mo+=12;y--;} while(mo>12){mo-=12;y++;} return `${y}-${pad(mo)}`; }
function dayLabel(ds){ const d=new Date(ds.slice(0,10)+'T12:00'); const today=nowLocal().slice(0,10); const y=new Date(Date.now()-864e5); const yest=`${y.getFullYear()}-${pad(y.getMonth()+1)}-${pad(y.getDate())}`;
  if(ds.slice(0,10)===today) return 'Hoy'; if(ds.slice(0,10)===yest) return 'Ayer';
  return d.toLocaleDateString('es-PE',{weekday:'long',day:'numeric',month:'short'}); }
const cat = id => S.cats.find(c=>c.id===id) || {id, name:'Sin categoría', icon:'sin-categoria', limit:0, color:'#64748b'};
const card = id => S.cards.find(c=>c.id===id);
const acc = id => S.accounts.find(a=>a.id===id);
const defAcc = () => acc(S.settings.lastAccount) || S.accounts[0] || null;
function accBalance(a){ return r2((a.initial||0) + sum(S.moves.filter(m=>m.accountId===a.id)) - sum(S.expenses.filter(e=>e.method==='debito'&&e.accountId===a.id))); }
function checkLow(a){
  if(!a) return; const key='acc|'+a.id, b=accBalance(a), lvl=(a.lowAlert>0 && b<a.lowAlert)?1:0, prev=S.alerts[key]||0;
  if(lvl>prev) setTimeout(()=>notify(`${a.name}: saldo bajo`, `Te quedan ${fmt(b)}. Tu aviso es por debajo de ${fmt(a.lowAlert)}.`, b<0?'over':'warn', 'debito'), 3000);
  S.alerts[key]=lvl;
}
const monthExp = m => S.expenses.filter(e=>e.date.slice(0,7)===m);
const sum = (arr, f=x=>x.amount) => arr.reduce((a,x)=>a+(f(x)||0),0);
function catSpent(m, cid){ return sum(monthExp(m).filter(e=>e.cat===cid)); }
function cardUsed(c){ return r2((c.initialDebt||0) + sum(S.expenses.filter(e=>e.method==='credito'&&e.cardId===c.id)) - sum(S.cardPayments.filter(p=>p.cardId===c.id))); }
function lastClosing(c){ const d=new Date(); let y=d.getFullYear(), mo=d.getMonth(); if(d.getDate()<=c.closingDay){ mo--; if(mo<0){mo=11;y--;} } const day=Math.min(c.closingDay, new Date(y,mo+1,0).getDate()); return `${y}-${pad(mo+1)}-${pad(day)}T23:59`; }
function cycleSpent(c){ const lc=lastClosing(c); return sum(S.expenses.filter(e=>e.method==='credito'&&e.cardId===c.id&&e.date>lc)); }
function nextDue(dayN){ const d=new Date(); let y=d.getFullYear(), mo=d.getMonth(); if(d.getDate()>dayN){ mo++; if(mo>11){mo=0;y++;} } const day=Math.min(dayN,new Date(y,mo+1,0).getDate()); return new Date(y,mo,day); }
function daysUntil(date){ const t=new Date(); t.setHours(0,0,0,0); return Math.round((date-t)/864e5); }
function levelOf(p){ return p>=1?'over':p>=.8?'warn':'ok'; }
const pct = (a,b) => b>0 ? a/b : 0;

let toastT;
function toast(msg, kind='', icon=''){ const t=$('#toast'); t.innerHTML=(icon?ico(icon):'')+esc(msg); t.className='toast show '+kind; clearTimeout(toastT); toastT=setTimeout(()=>t.className='toast '+kind, kind?4500:2200); }

/* ============ Notificaciones ============ */
async function notify(title, body, kind, icon=''){
  toast(title+' · '+body, kind, icon || (kind?'aviso':''));
  try{
    if('Notification' in window && Notification.permission==='granted'){
      const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
      if(reg) await reg.showNotification(title,{body, icon:'icons/icon-192.png', badge:'icons/icon-192.png', tag:title});
      else new Notification(title,{body});
    }
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate(200);
}
function checkAlerts(exp){
  const m = exp.date.slice(0,7);
  const c = cat(exp.cat);
  if(c.limit>0){
    const spent = catSpent(m, c.id), p = spent/c.limit, key=m+'|cat|'+c.id;
    const lvl = p>=1?2:p>=.8?1:0, prev = S.alerts[key]||0;
    if(lvl>prev){
      if(lvl===2) notify(`Límite de ${c.name} alcanzado`, `Llevas ${fmt(spent)} de ${fmt(c.limit)} este mes${spent>c.limit?` (te pasaste por ${fmt(spent-c.limit)})`:''}.`, 'over', c.icon);
      else notify(`${c.name}: 80% del límite`, `Llevas ${fmt(spent)} de ${fmt(c.limit)}. Te quedan ${fmt(c.limit-spent)}.`, 'warn', c.icon);
    }
    S.alerts[key] = Math.max(prev, lvl);
  }
  const totalLim = sum(S.cats, x=>x.limit);
  if(totalLim>0){
    const spent = sum(monthExp(m)), p=spent/totalLim, key=m+'|total';
    const lvl = p>=1?2:p>=.9?1:0, prev=S.alerts[key]||0;
    if(lvl>prev && lvl===2) setTimeout(()=>notify('Presupuesto del mes agotado', `Gastaste ${fmt(spent)} de ${fmt(totalLim)}.`, 'over'), 1200);
    S.alerts[key]=Math.max(prev,lvl);
  }
  if(exp.method==='credito' && card(exp.cardId)){
    const k=card(exp.cardId), used=cardUsed(k), p=pct(used,k.limit), key='card|'+k.id;
    const lvl = p>=1?2:p>=.8?1:0, prev=S.alerts[key]||0;
    if(lvl>prev) setTimeout(()=>notify(`${k.name}: ${lvl===2?'línea agotada':'80% de la línea'}`, `Usado ${fmt(used)} de ${fmt(k.limit)}. Disponible ${fmt(Math.max(0,k.limit-used))}.`, lvl===2?'over':'warn', 'credito'), 2400);
    S.alerts[key]=lvl; // la línea se libera al pagar, así que se reinicia
  }
  if(exp.method==='debito') checkLow(acc(exp.accountId));
  save();
}
async function enableNotifications(){
  if(!('Notification' in window)){
    alertSheet('Notificaciones', `<p>En iPhone las notificaciones solo funcionan cuando la app está <b>instalada en la pantalla de inicio</b> (iOS 16.4 o superior) y la abres desde su ícono, no desde Safari.</p><p class="muted small">Mientras tanto verás los avisos dentro de la app.</p>`);
    return;
  }
  const p = await Notification.requestPermission();
  if(p==='granted'){ notify('Notificaciones activadas','Te avisaré cuando llegues al 80% y al 100% de un límite.','', 'check');}
  else toast('Permiso denegado. Puedes activarlo en Ajustes › Notificaciones › Mis Gastos','warn');
  render();
}

/* ============ Gráficos ============ */
function donut(items, total){
  const R=52, C=2*Math.PI*R; let off=0;
  const segs = total>0 ? items.filter(i=>i.v>0).map(i=>{ const len=i.v/total*C; const s=`<circle r="${R}" cx="64" cy="64" fill="none" stroke="${i.color}" stroke-width="20" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}"/>`; off+=len; return s; }).join('') : '';
  return `<svg width="128" height="128" viewBox="0 0 128 128" style="transform:rotate(-90deg);flex:none"><circle r="${R}" cx="64" cy="64" fill="none" stroke="var(--chip)" stroke-width="20"/>${segs}</svg>`;
}
function legend(items, total){
  return `<div class="legend">${items.filter(i=>i.v>0).sort((a,b)=>b.v-a.v).map(i=>`<div class="lg"><span class="dot" style="background:${i.color}"></span>${i.ic?ico(i.ic):''}<span class="grow ellipsis">${esc(i.label)}</span><b>${fmt0(i.v)}</b><span class="muted tiny" style="width:34px;text-align:right">${Math.round(i.v/total*100)}%</span></div>`).join('')}</div>`;
}
function vbars(vals, labels, curIdx){
  const max = Math.max(...vals, 1);
  return `<div class="vbars">${vals.map((v,i)=>`<div class="vb ${i===curIdx?'cur':''}"><i style="height:${Math.max(2,v/max*100)}%" title="${fmt(v)}"></i><span>${labels[i]}</span></div>`).join('')}</div>`;
}
function progress(p, cls){ return `<div class="bar ${cls||levelOf(p)}"><i style="width:${Math.min(100,p*100)}%"></i></div>`; }

function monthNav(){ return `<div class="monthnav"><button class="iconbtn" data-a="mprev">‹</button><b>${monthLabel(view.month)}</b><button class="iconbtn" data-a="mnext">›</button></div>`; }

function dashMes(){

    <div class="row between small" style="margin-top:10px"><span class="muted">${ex.length} gasto${ex.length===1?'':'s'}</span><span class="muted">Promedio diario ${fmt0(total/Math.max(1,dayN))}</span></div></div>`;

  if(total>0){
    h += `<div class="card"><h2>Por categoría</h2><div class="donut-wrap">${donut(catItems,total)}${legend(catItems,total)}</div></div>`;

    h += `<div class="card"><h2>Gasto por día</h2>${vbars(daily, daily.map((_,i)=>(i+1)%5===0||i===0?i+1:''), isCur?dayN-1:-1)}</div>`;
    if(topPlaces.length) h += `<div class="card"><h2>Dónde más gastaste</h2>${topPlaces.map(([p,v])=>`<div class="row between small" style="padding:4px 0"><span class="ellipsis">${esc(p)}</span><b>${fmt(v)}</b></div>`).join('')}</div>`;
  } else h += `<div class="card empty">Aún no hay gastos en ${MONTHS[mo-1]}.<br><br><a class="btn" href="#nuevo">+ Registrar gasto</a></div>`;
  if(S.cards.length) h += `<div class="card"><div class="row between"><h2>Tarjetas</h2><a href="#tarjetas" class="small" style="color:var(--accent);text-decoration:none;font-weight:600">Ver ›</a></div>${S.cards.map(cardMini).join('')}</div>`;
  if(active.length) h += `<div class="card"><div class="row between"><h2>Cuotas por pagar</h2><a href="#cuotas" class="small" style="color:var(--accent);text-decoration:none;font-weight:600">Ver ›</a></div><div class="grid2"><div class="stat"><div class="lbl">Este mes</div><div class="val">${fmt0(cuotasMes)}</div></div><div class="stat"><div class="lbl">Deuda pendiente</div><div class="val">${fmt0(sum(active,p=>(p.n-p.paid)*p.cuota))}</div></div></div></div>`;
  if(S.goals.length) h += `<div class="card"><div class="row between"><h2>Metas</h2><a href="#metas" class="small" style="color:var(--accent);text-decoration:none;font-weight:600">Ver ›</a></div>${S.goals.slice(0,3).map(g=>`<div style="margin:8px 0"><div class="row between small"><span>${ico(g.icon,'in')}${esc(g.name)}</span><b>${Math.round(pct(g.saved,g.target)*100)}%</b></div><div class="bar" style="margin-top:4px"><i style="width:${Math.min(100,pct(g.saved,g.target)*100)}%"></i></div></div>`).join('')}</div>`;
  return h;
}

  const e = id ? S.expenses.find(x=>x.id===id) : null;
  let selCat = e?.cat || null, selMeth = e?.method || S.settings.lastMethod || 'debito';
  const setM = m => { selMeth=m; document.querySelectorAll('#meth button').forEach(b=>b.classList.toggle('on', b.dataset.m===m)); $('#creditBox').style.display = m==='credito'?'block':'none'; $('#cardSelWrap').style.display = S.cards.length?'block':'none'; $('#debitBox').style.display = m==='debito' && S.accounts.length>1?'block':'none'; };
  setM(selMeth);
  if(e?.cardId) $('#cardSel').value=e.cardId; else if(S.settings.lastCard && card(S.settings.lastCard)) $('#cardSel').value=S.settings.lastCard;
  if(e?.cuotas) $('#cuotas').value=e.cuotas;
  if(S.accounts.length){ const a0 = (e?.accountId && acc(e.accountId)) || defAcc(); if(a0) $('#accSel').value=a0.id; }
  if(e?.planId) $('#cuotas').disabled = true;
  document.querySelectorAll('#meth button').forEach(b=>b.onclick=()=>setM(b.dataset.m));
  document.querySelectorAll('.cat-btn').forEach(b=>b.onclick=()=>{ selCat=b.dataset.cat; document.querySelectorAll('.cat-btn').forEach(x=>x.classList.toggle('on',x===b)); });
  if(!e) setTimeout(()=>{ try{ $('#amt').focus(); }catch(_){} }, 250);
  $('#f').onsubmit = ev => {
    ev.preventDefault();
    const amount = r2(num($('#amt').value));
    if(amount<=0){ toast('Ingresa un monto','warn'); $('#amt').focus(); return; }
    if(!selCat){ toast('Elige una categoría','warn'); return; }
    const cardId = selMeth==='credito' && S.cards.length ? $('#cardSel').value : null;
    const cuotas = selMeth==='credito' ? Number($('#cuotas').value) : 1;
    const keepOld = e && e.method==='debito' && !e.accountId && selMeth==='debito'; // gastos anteriores a registrar la tarjeta no tocan el saldo
    const accountId = selMeth==='debito' && S.accounts.length && !keepOld ? (S.accounts.length>1 ? $('#accSel').value : S.accounts[0].id) : null;
    const data = {amount, cat:selCat, method:selMeth, cardId, accountId, cuotas, place:$('#place').value.trim(), note:$('#note').value.trim(), date:$('#date').value || nowLocal()};
    let exp;
    if(e){ Object.assign(e, data); exp=e;
      const plan = e.planId && S.plans.find(p=>p.id===e.planId);
      if(plan){ plan.total=amount; plan.cuota=r2(amount/plan.n); plan.name=data.place||cat(selCat).name; plan.cardId=cardId; }
    } else {
      exp = Object.assign({id:uid(), created:Date.now()}, data);
      if(cuotas>1){
        const plan = {id:uid(), kind:'tarjeta', name:data.place||cat(selCat).name, cardId, total:amount, n:cuotas, cuota:r2(amount/cuotas), paid:0, start:shiftMonth(data.date.slice(0,7),1), dueDay:cardId?card(cardId).dueDay:null, payments:[], expenseId:exp.id};
        S.plans.push(plan); exp.planId=plan.id;
      }
      S.expenses.push(exp);
    }
    S.settings.lastMethod = selMeth; if(cardId) S.settings.lastCard = cardId; if(accountId) S.settings.lastAccount = accountId;
    save();
    toast(e?'Cambios guardados':`Guardado: ${fmt(amount)} en ${cat(selCat).name}`, '', 'check');
    checkAlerts(exp);
    view.month = exp.date.slice(0,7);
    go(e?'#gastos':'#inicio');
  };
}

/* ============ Hojas (formularios modales) ============ */
function sheet(html, onMount){
  const bg = document.createElement('div'); bg.className='sheet-bg';
  bg.innerHTML = `<div class="sheet"><div class="grab"></div>${html}</div>`;
  bg.addEventListener('click', ev=>{ if(ev.target===bg) bg.remove(); });
  document.body.appendChild(bg);
  const close = ()=>bg.remove();
  bg.querySelectorAll('[data-close]').forEach(b=>b.onclick=close);
  onMount && onMount(bg, close);
  return close;
}
function alertSheet(title, html){ sheet(`<h2>${title}</h2>${html}<button class="btn block" data-close>Entendido</button>`); }
function formSheet(title, fields, onSave, extra=''){
  const html = `<h2>${title}</h2><form>${fields.map(f=>{
    if(f.type==='icon') return `<label class="f">${f.label}</label><div class="cat-grid ico-pick">${f.options.map(n=>`<label class="cat-btn ${f.value===n?'on':''}" aria-label="${n}"><input type="radio" name="${f.name}" value="${n}" ${f.value===n?'checked':''} hidden><span class="e">${ico(n)}</span></label>`).join('')}</div>`;
    if(f.type==='select') return `<label class="f">${f.label}</label><select class="in" name="${f.name}">${f.options.map(o=>`<option value="${esc(o[0])}" ${String(f.value)===String(o[0])?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`;
    return `<label class="f">${f.label}</label><input class="in" name="${f.name}" type="${f.type||'text'}" ${f.type==='number'?'inputmode="decimal" step="any"':''} value="${esc(f.value??'')}" placeholder="${esc(f.ph||'')}" ${f.req?'required':''}>${f.help?`<div class="tiny muted" style="margin-top:4px">${f.help}</div>`:''}`;
  }).join('')}<div style="height:16px"></div><button class="btn block" type="submit">Guardar</button>${extra}<div style="height:8px"></div><button class="btn block ghost" type="button" data-close>Cancelar</button></form>`;
  return sheet(html, (bg, close)=>{
    const form = bg.querySelector('form');
    form.querySelectorAll('.ico-pick input').forEach(i=>i.onchange=()=>i.closest('.ico-pick').querySelectorAll('.cat-btn').forEach(b=>b.classList.toggle('on', b.querySelector('input').checked)));
    form.onsubmit = ev => { ev.preventDefault(); const d = Object.fromEntries(new FormData(form)); if(onSave(d, close)!==false){ close(); save(); render(); } };
    const del = bg.querySelector('[data-del]'); if(del) del.onclick = ()=>{ if(confirm('¿Seguro que quieres eliminarlo?')){ extraDel(); close(); save(); render(); } };
  });
}
let extraDel = ()=>{};
const delBtn = fn => { extraDel = fn; return `<div style="height:8px"></div><button class="btn block danger" type="button" data-del>Eliminar</button>`; };

const actions = {
  mprev(){ view.month=shiftMonth(view.month,-1); render(); }, mnext(){ view.month=shiftMonth(view.month,1); render(); },
  yprev(){ view.year--; render(); }, ynext(){ view.year++; render(); },
  dash(v){ view.dash=v; render(); },
  gomonth(v){ view.month=v; },
  fcat(v){ view.fCat=v; render(); }, fmeth(v){ view.fMethod=v; render(); },
  edit(id){ go('#editar/'+id); },
  delexp(){ if(!confirm('¿Eliminar este gasto?')) return; const e=S.expenses.find(x=>x.id===editingId); if(e?.planId) S.plans=S.plans.filter(p=>p.id!==e.planId); S.expenses=S.expenses.filter(x=>x.id!==editingId); save(); toast('Gasto eliminado'); go('#gastos'); },
  notif(){ enableNotifications(); },
  editlimits(){
    sheet(`<h2>Límites mensuales</h2><p class="small muted" style="margin-top:0">Deja en 0 las categorías sin límite.</p><form>${S.cats.map(c=>`<div class="row" style="padding:6px 0;border-bottom:1px solid var(--border)"><span class="emo">${ico(c.icon)}</span><span class="grow">${esc(c.name)}</span><span class="muted small">${esc(S.settings.currency)}</span><input class="in lim-in" name="${c.id}" inputmode="decimal" value="${c.limit||''}" placeholder="0"></div>`).join('')}<div style="height:16px"></div><button class="btn block" type="submit">Guardar límites</button><div style="height:8px"></div><button class="btn block ghost" type="button" data-close>Cancelar</button></form>`,
      (bg,close)=>{ bg.querySelector('form').onsubmit=ev=>{ ev.preventDefault(); const d=Object.fromEntries(new FormData(ev.target)); S.cats.forEach(c=>{ const nl=r2(num(d[c.id])); if(nl!==c.limit){ c.limit=nl; Object.keys(S.alerts).forEach(k=>{ if(k.endsWith('|cat|'+c.id)) delete S.alerts[k]; }); } }); save(); close(); render(); toast('Límites guardados'); }; });
  },
  addcard(){ cardForm(); }, editcard(id){ cardForm(card(id)); },
  addacc(){ accForm(); }, editacc(id){ accForm(acc(id)); },
  addincome(id){ incomeForm(id); }, editincome(id){ const m=S.moves.find(x=>x.id===id); if(m) incomeForm(m.accountId, m); },
  paycard(id){ const c=card(id), u=cardUsed(c);
    formSheet(`Pago a ${esc(c.name)}`, [
      {name:'amount', label:'Monto pagado', type:'number', value:u>0?u.toFixed(2):'', req:true, help:`Deuda actual: ${fmt(u)}`},
      ...(S.accounts.length?[{name:'from', label:'Pagado desde', type:'select', value:defAcc()?.id||'', options:[...S.accounts.map(x=>[x.id,`${x.name} (saldo ${fmt(accBalance(x))})`]),['','Otra cuenta (no descontar)']]}]:[]),
      {name:'date', label:'Fecha', type:'date', value:nowLocal().slice(0,10)}
    ], d=>{ const a=r2(num(d.amount)); if(a<=0){toast('Monto inválido','warn');return false;} const pid=uid(), dt=d.date||nowLocal().slice(0,10); S.cardPayments.push({id:pid, cardId:id, amount:a, date:dt, accountId:d.from||null}); S.alerts['card|'+id]=0;
      if(d.from && acc(d.from)){ S.moves.push({id:uid(), kind:'pago-tarjeta', accountId:d.from, amount:-a, note:`Pago a ${c.name}`, date:dt, cardPaymentId:pid}); checkLow(acc(d.from)); }
      toast('Pago registrado. Línea liberada: '+fmt(a),'', 'check'); });
  },
  addplan(){ planForm(); }, editplan(id){ planForm(S.plans.find(p=>p.id===id)); },
  paycuota(id){ const p=S.plans.find(x=>x.id===id);
    if(p.kind==='prestamo'){
      formSheet(`Pagar cuota ${p.paid+1} de ${p.n}`, [
        {name:'amount', label:'Monto', type:'number', value:p.cuota, req:true},
        {name:'method', label:'Pagado con', type:'select', value:'debito', options:Object.entries(METHODS).filter(([k])=>k!=='credito').map(([k,v])=>[k,v.n])},
        {name:'reg', label:'¿Registrar como gasto del mes?', type:'select', value:'si', options:[['si','Sí, en la categoría Pagos'],['no','No']]}
      ], d=>{ const a=r2(num(d.amount)); p.paid++; p.payments=(p.payments||[]); p.payments.push({date:nowLocal(), amount:a});
        const fa = d.method==='debito' ? defAcc() : null;
        if(d.reg!=='si' && fa){ S.moves.push({id:uid(), kind:'pago-cuota', accountId:fa.id, amount:-a, note:`${p.name} · cuota ${p.paid}/${p.n}`, date:nowLocal().slice(0,10)}); checkLow(fa); }
        if(d.reg==='si'){ const exp={id:uid(), created:Date.now(), amount:a, cat:S.cats.find(c=>c.id==='pagos')?'pagos':S.cats[0].id, method:d.method, cardId:null, accountId:fa?fa.id:null, cuotas:1, place:p.name, note:`Cuota ${p.paid}/${p.n}`, date:nowLocal()}; S.expenses.push(exp); save(); checkAlerts(exp); }
        toast(p.paid>=p.n?'¡Préstamo pagado por completo!':`Cuota ${p.paid}/${p.n} registrada`, '', 'check'); });
    } else { p.paid++; (p.payments ||= []).push({date:nowLocal(), amount:p.cuota}); save(); render(); toast(p.paid>=p.n?'¡Compra pagada por completo!':`Cuota ${p.paid}/${p.n} marcada`, '', 'check'); }
  },
  addgoal(){ goalForm(); }, editgoal(id){ goalForm(S.goals.find(g=>g.id===id)); },
  addsaving(id){ savingForm(id, 1); }, subsaving(id){ savingForm(id, -1); },
  editcat(id){ catForm(cat(id)); }, addcat(){ catForm(); },
  export(){ download(`mis-gastos-respaldo-${nowLocal().slice(0,10)}.json`, JSON.stringify(S,null,1), 'application/json'); },
  csv(){ const rows=[['Fecha','Hora','Monto','Categoría','Medio de pago','Tarjeta','Cuotas','Lugar','Nota']].concat(S.expenses.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(e=>[e.date.slice(0,10),e.date.slice(11,16),String(e.amount).replace('.',','),cat(e.cat).name,METHODS[e.method].n,e.cardId&&card(e.cardId)?card(e.cardId).name:'',e.cuotas||1,e.place||'',e.note||'']));
    download(`mis-gastos-${nowLocal().slice(0,10)}.csv`, '﻿'+rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(';')).join('\n'), 'text/csv'); },
  import(){ const inp=$('#impFile'); inp.onchange=async()=>{ const f=inp.files[0]; if(!f) return; try{ const d=JSON.parse(await f.text()); if(!d.expenses||!d.cats) throw new Error('Archivo no válido'); if(!confirm(`Esto reemplazará tus datos actuales por el respaldo (${d.expenses.length} gastos). ¿Continuar?`)) return; S=migrateIcons(Object.assign(freshState(), d)); save(); render(); toast('Respaldo restaurado'); }catch(e){ toast('No se pudo leer: '+e.message,'over'); } }; inp.click(); },
  wipe(){ if(confirm('¿Borrar TODOS tus datos? Esto no se puede deshacer. Exporta un respaldo antes.') && confirm('¿Seguro? Última confirmación.')){ S=freshState(); save(); render(); toast('Datos borrados'); } }
};
async function download(name, content, type){
  const blob = new Blob([content], {type});
  const file = new File([blob], name, {type});
  if(navigator.canShare && navigator.canShare({files:[file]})){ try{ await navigator.share({files:[file], title:name}); return; }catch(e){ if(e.name==='AbortError') return; } }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1000);
}
function cardForm(c){
  formSheet(c?'Editar tarjeta':'Nueva tarjeta', [
    {name:'name', label:'Nombre', value:c?.name||'', ph:'Ej. Visa BCP', req:true},
    {name:'limit', label:'Línea de crédito', type:'number', value:c?.limit||'', req:true},
    {name:'initialDebt', label:'Deuda actual al registrarla', type:'number', value:c?.initialDebt||'', ph:'0', help:'Lo que ya tenías consumido antes de usar la app.'},
    {name:'closingDay', label:'Día de cierre de facturación', type:'number', value:c?.closingDay||20, req:true},
    {name:'dueDay', label:'Día de pago', type:'number', value:c?.dueDay||5, req:true}
  ], d=>{ const o={name:d.name.trim(), limit:r2(num(d.limit)), initialDebt:r2(num(d.initialDebt)), closingDay:Math.min(31,Math.max(1,Math.round(num(d.closingDay)))), dueDay:Math.min(31,Math.max(1,Math.round(num(d.dueDay))))};
    if(c) Object.assign(c,o); else { S.cards.push(Object.assign({id:uid()},o)); S.settings.lastCard ||= S.cards[S.cards.length-1].id; } toast('Tarjeta guardada'); },
  c?delBtn(()=>{ S.cards=S.cards.filter(x=>x.id!==c.id); }):'');
}
function accForm(a){
  formSheet(a?'Editar tarjeta de débito':'Nueva tarjeta de débito', [
    {name:'name', label:'Nombre', value:a?.name||'', ph:'Ej. Débito BCP', req:true},
    {name:'balance', label:'Saldo actual', type:'number', value:a?accBalance(a):'', req:true, help:a?'Si lo cambias, el saldo se ajusta a este monto desde hoy.':'Lo que tienes hoy en la cuenta.'},
    {name:'lowAlert', label:'Avisarme si el saldo baja de', type:'number', value:a?.lowAlert||'', ph:'0 = sin aviso'}
  ], d=>{ const bal=r2(num(d.balance)), o={name:d.name.trim(), lowAlert:r2(num(d.lowAlert))};
    if(a){ a.initial = r2((a.initial||0) + bal - accBalance(a)); Object.assign(a,o); checkLow(a); }
    else { const n=Object.assign({id:uid(), initial:bal, since:nowLocal()},o); S.accounts.push(n); S.settings.lastAccount ||= n.id; checkLow(n); }
    toast('Tarjeta de débito guardada','', 'check'); },
  a?delBtn(()=>{ S.accounts=S.accounts.filter(x=>x.id!==a.id); S.moves=S.moves.filter(m=>m.accountId!==a.id); S.expenses.forEach(e=>{ if(e.accountId===a.id) e.accountId=null; }); if(S.settings.lastAccount===a.id) S.settings.lastAccount=null; }):'');
}
function incomeForm(accountId, m){
  formSheet(m?'Editar ingreso':'Registrar ingreso', [
    {name:'amount', label:'Monto', type:'number', value:m?.amount||'', req:true},
    {name:'note', label:'Concepto', value:m?.note||'', ph:'Ej. Sueldo, transferencia, devolución'},
    ...(S.accounts.length>1?[{name:'accountId', label:'Tarjeta de débito', type:'select', value:m?.accountId||accountId, options:S.accounts.map(a=>[a.id,a.name])}]:[]),
    {name:'date', label:'Fecha', type:'date', value:m?.date||nowLocal().slice(0,10)}
  ], d=>{ const a=r2(num(d.amount)); if(a<=0){toast('Monto inválido','warn');return false;}
    const o={amount:a, note:(d.note||'').trim(), accountId:d.accountId||m?.accountId||accountId, date:d.date||nowLocal().slice(0,10)};
    if(m) Object.assign(m,o); else S.moves.push(Object.assign({id:uid(), kind:'ingreso'},o));
    checkLow(acc(o.accountId)); toast(m?'Ingreso actualizado':'Ingreso registrado: +'+fmt(a),'', 'check'); },
  m?delBtn(()=>{ S.moves=S.moves.filter(x=>x.id!==m.id); }):'');
}
function planForm(p){
  formSheet(p?'Editar':'Nuevo préstamo o cuotas', [
    {name:'kind', label:'Tipo', type:'select', value:p?.kind||'prestamo', options:[['prestamo','Préstamo'],['tarjeta','Compra en cuotas con tarjeta']]},
    {name:'name', label:'Nombre', value:p?.name||'', ph:'Ej. Préstamo personal, Laptop', req:true},
    {name:'entity', label:'Entidad', value:p?.entity||'', ph:'Ej. BCP, Interbank, Caja Arequipa'},
    ...(S.cards.length?[{name:'cardId', label:'Tarjeta (si es compra en cuotas)', type:'select', value:p?.cardId||'', options:[['','— Ninguna —'],...S.cards.map(c=>[c.id,c.name])]}]:[]),
    {name:'total', label:'Monto total', type:'number', value:p?.total||'', req:true},
    {name:'n', label:'Número de cuotas', type:'number', value:p?.n||12, req:true},
    {name:'cuota', label:'Monto de cada cuota', type:'number', value:p?.cuota||'', help:'Déjalo vacío para dividir el total entre las cuotas. Pon el monto real si hay intereses.'},
    {name:'paid', label:'Cuotas ya pagadas', type:'number', value:p?.paid||0},
    {name:'start', label:'Mes de la primera cuota', type:'month', value:p?.start||shiftMonth(curMonth(),1)},
    {name:'dueDay', label:'Día de pago', type:'number', value:p?.dueDay||'', ph:'Ej. 15'}
  ], d=>{ const n=Math.max(1,Math.round(num(d.n))), total=r2(num(d.total)); const k=d.cardId&&card(d.cardId);
    const o={kind:d.kind, name:d.name.trim(), cardId:k?d.cardId:null, entity:(d.entity||'').trim(), total, n, cuota:num(d.cuota)>0?r2(num(d.cuota)):r2(total/n), paid:Math.min(n,Math.max(0,Math.round(num(d.paid)))), start:d.start||curMonth(), dueDay:num(d.dueDay)>0?Math.round(num(d.dueDay)):(k?k.dueDay:null)};
    if(p) Object.assign(p,o); else S.plans.push(Object.assign({id:uid(), payments:[]},o)); toast('Guardado'); },
  p?delBtn(()=>{ S.plans=S.plans.filter(x=>x.id!==p.id); S.expenses.forEach(e=>{ if(e.planId===p.id) delete e.planId; }); }):'');
}
function goalForm(g){
  formSheet(g?'Editar meta':'Nueva meta', [
    {name:'icon', label:'Ícono', type:'icon', options:GOAL_ICONS, value:g?.icon||'presupuesto'},
    {name:'name', label:'Nombre', value:g?.name||'', ph:'Ej. Fondo de emergencia, Viaje a Cusco, iPhone', req:true},
    {name:'type', label:'Tipo', type:'select', value:g?.type||'ahorro', options:[['ahorro','Ahorro'],['compra','Meta de compra / cosa']]},
    {name:'target', label:'Monto objetivo', type:'number', value:g?.target||'', req:true},
    {name:'saved', label:'Ya ahorrado', type:'number', value:g?.saved||0},
    {name:'deadline', label:'Fecha objetivo (opcional)', type:'date', value:g?.deadline||''}
  ], d=>{ const o={icon:d.icon||'presupuesto', name:d.name.trim(), type:d.type, target:r2(num(d.target)), saved:r2(num(d.saved)), deadline:d.deadline||''};
    if(g) Object.assign(g,o); else S.goals.push(Object.assign({id:uid(), log:[]},o)); toast('Meta guardada'); },
  g?delBtn(()=>{ S.goals=S.goals.filter(x=>x.id!==g.id); }):'');
}
function savingForm(id, sign){ const g=S.goals.find(x=>x.id===id);
  formSheet(sign>0?`Abonar a ${esc(g.name)}`:`Retirar de ${esc(g.name)}`, [{name:'amount', label:'Monto', type:'number', req:true}], d=>{ const a=r2(num(d.amount)); if(a<=0){toast('Monto inválido','warn');return false;} const before=g.saved; g.saved=r2(Math.max(0,g.saved+sign*a)); (g.log ||= []).push({date:nowLocal(), amount:sign*a}); if(before<g.target && g.saved>=g.target) setTimeout(()=>notify('¡Meta lograda!', `Completaste "${g.name}": ${fmt(g.saved)}`, '', g.icon),300); else toast(sign>0?'Abono registrado':'Retiro registrado'); });
}
function catForm(c){
  formSheet(c?'Editar categoría':'Nueva categoría', [
    {name:'icon', label:'Ícono', type:'icon', options:CAT_ICONS, value:c?.icon||'etiqueta'},
    {name:'name', label:'Nombre', value:c?.name||'', req:true},
    {name:'limit', label:'Límite mensual', type:'number', value:c?.limit||'', ph:'0 = sin límite'}
  ], d=>{ const o={icon:d.icon||'etiqueta', name:d.name.trim(), limit:r2(num(d.limit))}; if(c) Object.assign(c,o); else S.cats.push(Object.assign({id:uid(), color:COLORS[S.cats.length%COLORS.length]},o)); },
  c&&S.cats.length>1?delBtn(()=>{ if(S.expenses.some(e=>e.cat===c.id) && !confirm('Hay gastos en esta categoría; pasarán a "Otros". ¿Continuar?')) return; const fb=S.cats.find(x=>x.id!==c.id&&x.id==='otros')||S.cats.find(x=>x.id!==c.id); S.expenses.forEach(e=>{ if(e.cat===c.id) e.cat=fb.id; }); S.cats=S.cats.filter(x=>x.id!==c.id); }):'');
}

/* ============ Eventos ============ */
document.addEventListener('click', ev=>{
  const el = ev.target.closest('[data-a]'); if(!el || el.closest('.sheet-bg') && !el.closest('.sheet')) return;
  const fn = actions[el.dataset.a]; if(!fn) return;
  if(el.tagName==='BUTTON' || el.classList.contains('item')) ev.preventDefault();
  fn(el.dataset.v);
});
document.addEventListener('input', ev=>{ if(ev.target.id==='q'){ view.q=ev.target.value; const pos=ev.target.selectionStart; render(); const q=$('#q'); q.focus(); q.setSelectionRange(pos,pos); } });
document.addEventListener('change', ev=>{
  if(ev.target.id==='curSel'){ S.settings.currency=ev.target.value; save(); render(); }
  if(ev.target.id==='qa'){ S.settings.quickAdd=ev.target.checked; save(); toast(ev.target.checked?'El ícono abrirá el formulario de gasto':'El ícono abrirá el inicio'); }
});

/* ============ Arranque ============ */
(function start(){
  const params = new URLSearchParams(location.search);
  const wantsNew = params.has('nuevo') || location.hash==='#nuevo';
  if(wantsNew || (S.settings.quickAdd && !location.hash)) { history.replaceState(null,'',location.pathname+'#nuevo'); }
  document.querySelectorAll('[data-ic]').forEach(el=>el.innerHTML=ico(el.dataset.ic));
  render();
  let hiddenAt = 0;
  document.addEventListener('visibilitychange', ()=>{
    if(document.hidden){ hiddenAt=Date.now(); return; }
    view.month = view.month || curMonth();
    if(S.settings.quickAdd && hiddenAt && Date.now()-hiddenAt > 3*60*1000 && !document.querySelector('.sheet-bg') && !location.hash.startsWith('#editar')){ go('#nuevo'); }
  });
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
  if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
})();
</script>
